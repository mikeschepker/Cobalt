<!DOCTYPE html>
<html lang="{{ or .Site.LanguageCode "en" }}">
{{ partial "head.html" . }}
<body>
  {{ partial "header.html" . }}
  <main id="main">
    <div class="wrap">
      {{ block "main" . }}{{ end }}
    </div>
  </main>
  {{ partial "footer.html" . }}
  {{ partial "custom_footer.html" . }}
  {{ range .Site.Params.plugins_js }}
    <script src="{{ . }}"></script>
  {{ end }}

  {{ with .Site.Params.cobalt_footer_code }}
    {{ . | safeHTML }}
  {{ end }}
</body>
</html>
