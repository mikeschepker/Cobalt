{{ $page := .page }}
<meta property="og:site_name" content="{{ $page.Site.Title }}">
<meta property="og:type" content="{{ if .isArticle }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ .title }}">
<meta property="og:description" content="{{ .description }}">
<meta property="og:url" content="{{ $page.Permalink }}">
{{ with .image }}
  <meta property="og:image" content="{{ . | absURL }}">
  <meta property="og:image:alt" content="{{ $.title }}">
{{ end }}
{{ with $page.Site.LanguageCode }}<meta property="og:locale" content="{{ replace . "-" "_" }}">{{ end }}
{{ if .isArticle }}
  <meta property="article:published_time" content="{{ $page.Date.Format "2006-01-02T15:04:05Z07:00" }}">
  <meta property="article:modified_time" content="{{ $page.Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{ end }}
